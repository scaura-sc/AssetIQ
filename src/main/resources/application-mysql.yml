spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:assetiq}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:assetiq}
    password: ${DB_PASSWORD:assetiq}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        # Liquibase's generic BOOLEAN type creates tinyint(1) on MySQL (the
        # MySQL convention), but Hibernate 6's MySQLDialect otherwise expects
        # BIT for java.lang.Boolean during schema validation. Align it so
        # `ddl-auto: validate` doesn't flag every boolean column as a mismatch.
        type:
          preferred_boolean_jdbc_type: TINYINT

  liquibase:
    driver-class-name: com.mysql.cj.jdbc.Driver
