spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:assetiq}
    username: ${DB_USERNAME:assetiq}
    password: ${DB_PASSWORD:assetiq}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    driver-class-name: org.postgresql.Driver
